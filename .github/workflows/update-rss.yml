name: Actualizar RSS Cronica Vasca Empresas

on:
  workflow_dispatch:

  schedule:
    # Cada hora, minuto 17
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: actualizar-rss-cronica-vasca
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generar RSS
        run: |
          python main.py

      - name: Comprobar RSS
        run: |
          test -f feed.xml

          python - <<'PY'
          import xml.etree.ElementTree as ET

          tree = ET.parse("feed.xml")
          items = tree.findall("./channel/item")

          print("Entradas RSS:", len(items))

          if not items:
              raise SystemExit(
                  "ERROR: La RSS no contiene noticias."
              )

          print("\nÚltimos titulares:")

          for item in items[:10]:
              print("-", item.findtext("title"))
          PY

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add feed.xml

          if git diff --cached --quiet; then
            echo "No hay cambios."
          else
            git commit -m "Actualizar RSS Cronica Vasca Empresas"
            git push
          fi
